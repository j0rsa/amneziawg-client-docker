# Option A — container loads the tun module automatically on first start
# (survives DSM reboots without a boot task; costs CAP_SYS_MODULE)
services:
  amneziawg-client:
    image: ghcr.io/j0rsa/amneziawg-client:latest
    container_name: amneziawg-client
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
      # SYS_MODULE lets the container run insmod/modprobe to load tun.ko from
      # the host's /lib/modules. Remove it (and the /lib/modules volume) if you
      # prefer to load the module manually — see Option B below.
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # Put your .conf here; filename becomes interface name (spb.conf → spb)
      - /volume1/docker/awg:/config:ro
      # Host kernel modules — needed so the container can load tun.ko via modprobe.
      # Remove if not using SYS_MODULE (Option B).
      - /lib/modules:/lib/modules:ro

# Option B — load tun.ko manually on the host before starting the container
#
# 1. SSH into the NAS and run:
#      sudo insmod /lib/modules/tun.ko
#      ls /dev/net/tun      # should appear
#
# 2. Remove the SYS_MODULE cap_add and the /lib/modules volume above, then:
#      docker compose up -d
#
# 3. To survive reboots, add a Scheduled Task → Triggered task → Boot-up in
#    DSM Control Panel that runs:
#      insmod /lib/modules/tun.ko

# Example /volume1/docker/awg/spb.conf:
#
# [Interface]
# Address = 10.10.0.2/24
# PrivateKey = <key>
# DNS = 1.1.1.1
# Jc = 4
# Jmin = 40
# Jmax = 70
# S1 = 0
# S2 = 0
# H1 = 1
# H2 = 2
# H3 = 3
# H4 = 4
#
# [Peer]
# PublicKey = <key>
# PresharedKey = <key>
# AllowedIPs = 0.0.0.0/0
# Endpoint = <host>:<port>
# PersistentKeepalive = 25
