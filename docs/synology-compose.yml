services:
  amneziawg-client:
    image: ghcr.io/j0rsa/amneziawg-client:latest
    container_name: amneziawg-client
    restart: always
    # network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # Put your .conf here; filename becomes interface name (spb.conf → spb)
      - /volume1/docker/awg:/config:ro
    # sysctls only matter if you use a non-host network; with network_mode: host they're ignored
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

# Example /volume1/docker/awg/spb.conf:
#
# [Interface]
# Address = 10.10.0.2/24
# PrivateKey = <key>
# DNS = 1.1.1.1
# Jc = 4
# Jmin = 40
# Jmax = 70
# S1 = 0
# S2 = 0
# H1 = 1
# H2 = 2
# H3 = 3
# H4 = 4
#
# [Peer]
# PublicKey = <key>
# PresharedKey = <key>
# AllowedIPs = 0.0.0.0/0
# Endpoint = <host>:<port>
# PersistentKeepalive = 25
