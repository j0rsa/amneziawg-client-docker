name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/amneziawg-client

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # v1.2.3 → 1.2.3 + 1.2 + 1 + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # main branch → main-<short-sha>
            type=ref,event=branch,suffix=-{{sha}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 only and load into the local daemon for testing.
      # Buildx caches the layers; the multi-arch push step below reuses them.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: amneziawg-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify iptables symlinks point to legacy
        run: |
          docker run --rm --entrypoint sh amneziawg-test:ci -c "
            iptables --version | grep -q legacy || { echo 'FAIL: iptables is not legacy'; exit 1; }
            iptables-restore --version | grep -q legacy || { echo 'FAIL: iptables-restore is not legacy'; exit 1; }
            echo 'OK: iptables and iptables-restore both point to legacy'
          "

      - name: Smoke test - awg-quick up with dummy config
        run: |
          sudo apt-get install -y wireguard-tools -q
          PRIVATE_KEY=$(wg genkey)
          PEER_KEY=$(wg genkey | wg pubkey)
          mkdir -p /tmp/awg-config
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.99.99.1/32\nDNS = 1.1.1.1\n\n[Peer]\nPublicKey = %s\nEndpoint = 127.0.0.1:51820\nAllowedIPs = 0.0.0.0/0\n' \
            "$PRIVATE_KEY" "$PEER_KEY" > /tmp/awg-config/test.conf

          docker run -d --name awg-smoke \
            --privileged \
            --cap-add NET_ADMIN \
            --device /dev/net/tun \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v /tmp/awg-config:/config:ro \
            amneziawg-test:ci

          sleep 5
          docker logs awg-smoke 2>&1 | tee /tmp/awg-smoke.log
          docker stop awg-smoke

          if grep -qE "iptables.*command not found|iptables-restore.*command not found|Could not fetch rule set" /tmp/awg-smoke.log; then
            echo "FAIL: iptables errors detected in logs"
            exit 1
          fi
          if ! grep -q "awg interface" /tmp/awg-smoke.log; then
            echo "FAIL: container did not start up"
            exit 1
          fi
          echo "PASS: no iptables errors, interface came up"

      # amd64 layers are already in the buildx cache from the test build above.
      - name: Build and push multi-arch images
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
